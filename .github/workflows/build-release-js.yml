name: 'Build JS Release'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release-js:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Setup Node'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build release (JS)'
        run: 'npm run build'

      - name: 'Compute release metadata'
        id: 'release_meta'
        shell: 'bash'
        run: |
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION_JSON="$(node scripts/get-release-version.js --type=stable)"
            RELEASE_VERSION="$(echo "${VERSION_JSON}" | jq -r .releaseVersion)"
            RELEASE_TAG="$(echo "${VERSION_JSON}" | jq -r .releaseTag)"
          fi

          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: 'Package JS artifact'
        shell: 'bash'
        run: |
          mkdir -p release-assets
          cp bundle/gemini.js "release-assets/gemini-${{ steps.release_meta.outputs.release_version }}.js"

      - name: 'Upload JS artifact'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'gemini-js-${{ steps.release_meta.outputs.release_version }}'
          path: 'release-assets/gemini-${{ steps.release_meta.outputs.release_version }}.js'

      - name: 'Publish asset to GitHub release'
        if: "${{ github.ref_type == 'tag' }}"
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          RELEASE_TAG: '${{ steps.release_meta.outputs.release_tag }}'
          RELEASE_VERSION: '${{ steps.release_meta.outputs.release_version }}'
        shell: 'bash'
        run: |
          ASSET_PATH="release-assets/gemini-${RELEASE_VERSION}.js"

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes "JavaScript release asset for ${RELEASE_TAG}."
          fi

          gh release upload "${RELEASE_TAG}" "${ASSET_PATH}" --clobber
